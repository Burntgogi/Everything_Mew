[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "everything-mew"
version = "0.3.0rc1"
description = "Everything_Mew: a read-only MCP server that helps AI agents search with Everything"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/Burntgogi/Everything_Mew"
Repository = "https://github.com/Burntgogi/Everything_Mew"
Changelog = "https://github.com/Burntgogi/Everything_Mew/blob/main/CHANGELOG.md"
Issues = "https://github.com/Burntgogi/Everything_Mew/issues"

[project.optional-dependencies]
server = ["fastmcp>=2"]
test = ["pytest>=8"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.15,<0.16", "mypy>=1.11"]

[project.scripts]
everything-mew = "everything_mcp.__main__:main"
everything-mcp = "everything_mcp.__main__:main"
everything-mew-lite = "everything_mcp.lite_stdio:main"
everything-mcp-lite = "everything_mcp.lite_stdio:main"
everything-mew-once = "everything_mcp.oneshot:main"
everything-mcp-once = "everything_mcp.oneshot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/everything_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/.gitattributes",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/README.ko.md",
    "/SECURITY.md",
    "/docs/AGENT_INSTALLATION_GUIDE.md",
    "/docs/releases/*.md",
    "/docs/SDK_INSTALL_GUIDE_FOR_AGENTS.md",
    "/opencode.example.json",
    "/pyproject.toml",
    "/scripts/measure_lite_sessions.ps1",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
